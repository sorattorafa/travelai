name: travelai
description: "GuIA - Seu guia de viagens com inteligência artificial."
publish_to: 'none'
version: 1.0.2+12

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  http: ^1.4.0
  flutter_dotenv: ^5.2.1
  firebase_core: ^4.0.0
  firebase_ai: ^3.15.0
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.0
  cloud_functions: ^6.0.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.3
  in_app_purchase: ^3.2.0
  flutter_secure_storage: ^9.2.2
  uuid: ^4.5.1
  connectivity_plus: ^6.1.0
  firebase_app_check: ^0.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.6
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#435892"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter_native_splash:
  color: "#393F50"
  color_dark: "#393F50"
  image: "assets/icon/icon.png"
  android_12:
    color: "#393F50"
    image: "assets/icon/icon.png"
  ios: true

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/icon/
